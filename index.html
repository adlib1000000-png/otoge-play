<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>otoge</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #05050d; }
      #unity-canvas {
        display: block; width: 100vw; height: 100vh; background: #05050d; outline: none;
        /* タップ連打でページがスクロール・拡大・長押しメニュー表示しないように */
        touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; color: #ccd; font: 16px system-ui, sans-serif;
      }
      #bar { width: min(320px, 70vw); height: 6px; background: #223; border-radius: 3px; overflow: hidden; }
      #bar-fill { width: 0; height: 100%; background: #6c8cff; transition: width 0.2s; }
      #error { color: #f88; max-width: 80vw; text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div id="loading-text">読み込み中...</div>
      <div id="bar"><div id="bar-fill"></div></div>
      <div id="error"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "otoge",
        productVersion: "1.0",
      };

      // キー入力がゲームに届くよう、クリックでキャンバスにフォーカスする
      canvas.addEventListener("pointerdown", function () { canvas.focus(); });
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      // 矢印キーやスペースでページがスクロールしないように
      window.addEventListener("keydown", function (e) {
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].indexOf(e.key) >= 0) e.preventDefault();
      });

      var script = document.createElement("script");
      script.src = buildUrl + "/WebGL.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#bar-fill").style.width = 100 * progress + "%";
        }).then(function () {
          document.querySelector("#loading").style.display = "none";
          canvas.focus();
        }).catch(function (message) {
          document.querySelector("#loading-text").textContent = "起動できませんでした";
          document.querySelector("#error").textContent = message;
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
